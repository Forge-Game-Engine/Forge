<svg xmlns="http://www.w3.org/2000/svg" width="256" height="128" viewBox="0 0 256 128" shape-rendering="crispEdges">
  <!-- An 8 by 4 grid of 32 by 32 tiles for the Tiled maps demo. Original art, made for this demo. -->
  <defs>
    <pattern id="dirt" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#8f563b"/>
      <rect x="4" y="12" width="2" height="2" fill="#663931"/>
      <rect x="14" y="6" width="2" height="2" fill="#663931"/>
      <rect x="24" y="16" width="4" height="2" fill="#663931"/>
      <rect x="8" y="24" width="2" height="2" fill="#663931"/>
      <rect x="18" y="26" width="2" height="2" fill="#b07650"/>
      <rect x="26" y="4" width="2" height="2" fill="#b07650"/>
      <rect x="10" y="18" width="2" height="2" fill="#b07650"/>
      <rect x="0" y="30" width="2" height="2" fill="#663931"/>
      <rect x="28" y="28" width="2" height="2" fill="#663931"/>
    </pattern>
    <pattern id="hill" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#7fb7a0"/>
      <rect x="6" y="20" width="2" height="2" fill="#6aa28b"/>
      <rect x="20" y="10" width="2" height="2" fill="#6aa28b"/>
      <rect x="26" y="26" width="2" height="2" fill="#6aa28b"/>
      <rect x="14" y="28" width="2" height="2" fill="#6aa28b"/>
    </pattern>
  </defs>

  <!-- 0: grass on dirt. -->
  <g transform="translate(0 0)">
    <rect width="32" height="32" fill="url(#dirt)"/>
    <rect width="32" height="8" fill="#6abe30"/>
    <rect y="8" width="4" height="2" fill="#6abe30"/>
    <rect x="10" y="8" width="6" height="2" fill="#6abe30"/>
    <rect x="22" y="8" width="4" height="2" fill="#6abe30"/>
    <rect y="10" width="4" height="2" fill="#4b8b2a"/>
    <rect x="4" y="8" width="6" height="2" fill="#4b8b2a"/>
    <rect x="10" y="10" width="6" height="2" fill="#4b8b2a"/>
    <rect x="16" y="8" width="6" height="2" fill="#4b8b2a"/>
    <rect x="22" y="10" width="4" height="2" fill="#4b8b2a"/>
    <rect x="26" y="8" width="6" height="2" fill="#4b8b2a"/>
    <rect width="32" height="2" fill="#99e550"/>
  </g>

  <!-- 1: dirt. -->
  <rect x="32" y="0" width="32" height="32" fill="url(#dirt)"/>

  <!-- 2: slope rising to the right. -->
  <g transform="translate(64 0)">
    <polygon points="0,32 32,0 32,32" fill="url(#dirt)"/>
    <polygon points="0,32 32,0 32,10 10,32" fill="#4b8b2a"/>
    <polygon points="0,32 32,0 32,8 8,32" fill="#6abe30"/>
    <polygon points="0,32 32,0 32,2 2,32" fill="#99e550"/>
  </g>

  <!-- 3: slope falling to the right. -->
  <g transform="translate(96 0)">
    <polygon points="0,0 32,32 0,32" fill="url(#dirt)"/>
    <polygon points="0,0 32,32 22,32 0,10" fill="#4b8b2a"/>
    <polygon points="0,0 32,32 24,32 0,8" fill="#6abe30"/>
    <polygon points="0,0 32,32 30,32 0,2" fill="#99e550"/>
  </g>

  <!-- 4: stone block, the tile a click places. -->
  <g transform="translate(128 0)">
    <rect width="32" height="32" fill="#9badb7"/>
    <rect width="32" height="2" fill="#cbdbfc"/>
    <rect width="2" height="32" fill="#cbdbfc"/>
    <rect y="30" width="32" height="2" fill="#5f6b78"/>
    <rect x="30" width="2" height="32" fill="#5f6b78"/>
    <rect x="2" y="14" width="28" height="2" fill="#5f6b78"/>
    <rect x="14" y="2" width="2" height="12" fill="#5f6b78"/>
    <rect x="8" y="16" width="2" height="14" fill="#5f6b78"/>
    <rect x="22" y="16" width="2" height="14" fill="#5f6b78"/>
    <rect x="4" y="4" width="2" height="2" fill="#cbdbfc"/>
    <rect x="20" y="6" width="2" height="2" fill="#cbdbfc"/>
    <rect x="26" y="22" width="2" height="2" fill="#cbdbfc"/>
  </g>

  <!-- 7: the player, standing on the tile's bottom edge. -->
  <g transform="translate(224 0)">
    <rect x="10" y="2" width="12" height="4" fill="#4a2e1c"/>
    <rect x="8" y="4" width="16" height="2" fill="#4a2e1c"/>
    <rect x="8" y="6" width="16" height="8" fill="#f2c29b"/>
    <rect x="8" y="6" width="2" height="4" fill="#4a2e1c"/>
    <rect x="22" y="6" width="2" height="4" fill="#4a2e1c"/>
    <rect x="12" y="8" width="2" height="2" fill="#1a1a26"/>
    <rect x="18" y="8" width="2" height="2" fill="#1a1a26"/>
    <rect x="14" y="12" width="4" height="2" fill="#a83434"/>
    <rect x="8" y="14" width="16" height="8" fill="#d94848"/>
    <rect x="8" y="20" width="16" height="2" fill="#a83434"/>
    <rect x="6" y="14" width="2" height="6" fill="#d94848"/>
    <rect x="24" y="14" width="2" height="6" fill="#d94848"/>
    <rect x="6" y="20" width="2" height="2" fill="#f2c29b"/>
    <rect x="24" y="20" width="2" height="2" fill="#f2c29b"/>
    <rect x="8" y="22" width="16" height="4" fill="#3d4f8c"/>
    <rect x="8" y="26" width="6" height="4" fill="#3d4f8c"/>
    <rect x="18" y="26" width="6" height="4" fill="#3d4f8c"/>
    <rect x="6" y="30" width="8" height="2" fill="#20202a"/>
    <rect x="18" y="30" width="8" height="2" fill="#20202a"/>
  </g>

  <!-- 8 to 11: water surface, four frames of a wave moving right. -->
  <g transform="translate(0 32)">
    <polygon points="0,6 4,7 8,8 12,7 16,6 20,5 24,4 28,5 32,6 32,32 0,32" fill="#7fd0f5" fill-opacity="0.85"/>
    <polygon points="0,10 4,11 8,12 12,11 16,10 20,9 24,8 28,9 32,10 32,32 0,32" fill="#3f8fd8" fill-opacity="0.85"/>
    <polyline points="0,6 4,7 8,8 12,7 16,6 20,5 24,4 28,5 32,6" fill="none" stroke="#e8f8ff" stroke-width="2"/>
  </g>
  <g transform="translate(32 32)">
    <polygon points="0,8 4,7 8,6 12,5 16,4 20,5 24,6 28,7 32,8 32,32 0,32" fill="#7fd0f5" fill-opacity="0.85"/>
    <polygon points="0,12 4,11 8,10 12,9 16,8 20,9 24,10 28,11 32,12 32,32 0,32" fill="#3f8fd8" fill-opacity="0.85"/>
    <polyline points="0,8 4,7 8,6 12,5 16,4 20,5 24,6 28,7 32,8" fill="none" stroke="#e8f8ff" stroke-width="2"/>
  </g>
  <g transform="translate(64 32)">
    <polygon points="0,6 4,5 8,4 12,5 16,6 20,7 24,8 28,7 32,6 32,32 0,32" fill="#7fd0f5" fill-opacity="0.85"/>
    <polygon points="0,10 4,9 8,8 12,9 16,10 20,11 24,12 28,11 32,10 32,32 0,32" fill="#3f8fd8" fill-opacity="0.85"/>
    <polyline points="0,6 4,5 8,4 12,5 16,6 20,7 24,8 28,7 32,6" fill="none" stroke="#e8f8ff" stroke-width="2"/>
  </g>
  <g transform="translate(96 32)">
    <polygon points="0,4 4,5 8,6 12,7 16,8 20,7 24,6 28,5 32,4 32,32 0,32" fill="#7fd0f5" fill-opacity="0.85"/>
    <polygon points="0,8 4,9 8,10 12,11 16,12 20,11 24,10 28,9 32,8 32,32 0,32" fill="#3f8fd8" fill-opacity="0.85"/>
    <polyline points="0,4 4,5 8,6 12,7 16,8 20,7 24,6 28,5 32,4" fill="none" stroke="#e8f8ff" stroke-width="2"/>
  </g>

  <!-- 12: deep water. -->
  <g transform="translate(128 32)">
    <rect width="32" height="32" fill="#3f8fd8" fill-opacity="0.85"/>
    <rect x="6" y="8" width="6" height="2" fill="#2b64a8" fill-opacity="0.85"/>
    <rect x="20" y="20" width="6" height="2" fill="#2b64a8" fill-opacity="0.85"/>
    <rect x="10" y="26" width="4" height="2" fill="#7fd0f5" fill-opacity="0.85"/>
  </g>

  <!-- 13 to 15: background hill, and its rising and falling edges. -->
  <rect x="160" y="32" width="32" height="32" fill="url(#hill)"/>
  <polygon points="192,64 224,32 224,64" fill="url(#hill)"/>
  <polygon points="224,32 256,64 224,64" fill="url(#hill)"/>

  <!-- 16 and 17: a cloud two tiles wide. -->
  <g fill="#ffffff">
    <circle cx="18" cy="82" r="9"/>
    <circle cx="32" cy="78" r="11"/>
    <circle cx="46" cy="82" r="9"/>
    <rect x="10" y="82" width="44" height="8"/>
  </g>
  <rect x="12" y="86" width="40" height="4" fill="#dcebf5"/>

  <!-- 18: bush. -->
  <g transform="translate(64 64)" fill="#3f8f3a">
    <circle cx="10" cy="22" r="9"/>
    <circle cx="21" cy="20" r="10"/>
    <circle cx="15" cy="13" r="8"/>
    <rect x="2" y="24" width="28" height="8"/>
    <rect x="12" y="8" width="4" height="2" fill="#5fb84e"/>
    <rect x="6" y="18" width="4" height="2" fill="#5fb84e"/>
    <rect x="22" y="16" width="2" height="2" fill="#5fb84e"/>
    <rect x="16" y="26" width="4" height="2" fill="#2d6b2a"/>
    <rect x="24" y="24" width="2" height="2" fill="#2d6b2a"/>
  </g>

  <!-- 19: tree trunk. -->
  <g transform="translate(96 64)">
    <rect x="12" y="0" width="8" height="32" fill="#7a4e2d"/>
    <rect x="12" y="0" width="2" height="32" fill="#5a3820"/>
    <rect x="10" y="28" width="12" height="4" fill="#7a4e2d"/>
    <rect x="16" y="10" width="2" height="2" fill="#5a3820"/>
    <rect x="16" y="20" width="2" height="2" fill="#5a3820"/>
  </g>

  <!-- 20: tree canopy. -->
  <g transform="translate(128 64)">
    <circle cx="16" cy="17" r="15" fill="#3f8f3a"/>
    <circle cx="12" cy="12" r="7" fill="#5fb84e"/>
    <rect x="20" y="22" width="4" height="2" fill="#2d6b2a"/>
    <rect x="8" y="24" width="2" height="2" fill="#2d6b2a"/>
    <rect x="22" y="10" width="2" height="2" fill="#2d6b2a"/>
  </g>

  <!-- 21: tall grass, in front of the player. -->
  <g transform="translate(160 64)">
    <polygon points="0,32 3,16 6,32" fill="#4f9a2a"/>
    <polygon points="4,32 8,10 12,32" fill="#7ad13f"/>
    <polygon points="10,32 14,18 18,32" fill="#4f9a2a"/>
    <polygon points="15,32 19,8 23,32" fill="#7ad13f"/>
    <polygon points="21,32 25,16 29,32" fill="#4f9a2a"/>
    <polygon points="26,32 30,12 32,32" fill="#7ad13f"/>
  </g>

  <!-- 22: flowers, in front of the player. -->
  <g transform="translate(192 64)">
    <polygon points="0,32 3,22 6,32" fill="#7ad13f"/>
    <polygon points="8,32 12,20 16,32" fill="#4f9a2a"/>
    <polygon points="18,32 22,22 26,32" fill="#7ad13f"/>
    <polygon points="24,32 28,18 32,32" fill="#4f9a2a"/>
    <rect x="6" y="14" width="2" height="18" fill="#4f9a2a"/>
    <rect x="16" y="10" width="2" height="22" fill="#4f9a2a"/>
    <rect x="26" y="16" width="2" height="16" fill="#4f9a2a"/>
    <g fill="#ffd34d">
      <rect x="4" y="10" width="6" height="4"/>
      <rect x="6" y="8" width="2" height="8"/>
      <rect x="24" y="12" width="6" height="4"/>
      <rect x="26" y="10" width="2" height="8"/>
    </g>
    <g fill="#f05a5a">
      <rect x="14" y="6" width="6" height="4"/>
      <rect x="16" y="4" width="2" height="8"/>
    </g>
  </g>

  <!-- 23: fence, in front of the player. -->
  <g transform="translate(224 64)">
    <rect y="12" width="32" height="4" fill="#b58350"/>
    <rect y="22" width="32" height="4" fill="#b58350"/>
    <rect y="14" width="32" height="2" fill="#7d5530"/>
    <rect y="24" width="32" height="2" fill="#7d5530"/>
    <rect x="4" y="6" width="6" height="26" fill="#b58350"/>
    <rect x="8" y="6" width="2" height="26" fill="#7d5530"/>
    <rect x="6" y="4" width="2" height="2" fill="#b58350"/>
    <rect x="22" y="6" width="6" height="26" fill="#b58350"/>
    <rect x="26" y="6" width="2" height="26" fill="#7d5530"/>
    <rect x="24" y="4" width="2" height="2" fill="#b58350"/>
  </g>
</svg>
