<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64" shape-rendering="crispEdges">
  <!-- A 4 by 2 grid of 64 by 32 isometric floor tiles for the isometric tilemap demo. Original art, made for this demo. -->
  <!-- Each floor diamond has a stroke of its own color, which overlaps its neighbors by half a pixel so no seam shows between cells. -->
  <defs>
    <clipPath id="water-surface">
      <polygon points="32,0 64,16 32,32 0,16"/>
    </clipPath>
  </defs>

  <!-- 0: grass. -->
  <g transform="translate(0 0)">
    <polygon points="32,0 64,16 32,32 0,16" fill="#5fa83a" stroke="#5fa83a" stroke-width="1"/>
    <rect x="20" y="10" width="2" height="2" fill="#4f9a2e"/>
    <rect x="40" y="12" width="2" height="2" fill="#4f9a2e"/>
    <rect x="30" y="20" width="2" height="2" fill="#4f9a2e"/>
    <rect x="14" y="16" width="2" height="2" fill="#4f9a2e"/>
    <rect x="46" y="18" width="2" height="2" fill="#4f9a2e"/>
    <rect x="26" y="8" width="2" height="2" fill="#4f9a2e"/>
    <rect x="36" y="25" width="2" height="2" fill="#4f9a2e"/>
  </g>

  <!-- 1: grass with flowers. -->
  <g transform="translate(64 0)">
    <polygon points="32,0 64,16 32,32 0,16" fill="#5fa83a" stroke="#5fa83a" stroke-width="1"/>
    <rect x="20" y="10" width="2" height="2" fill="#4f9a2e"/>
    <rect x="40" y="12" width="2" height="2" fill="#4f9a2e"/>
    <rect x="30" y="20" width="2" height="2" fill="#4f9a2e"/>
    <rect x="46" y="18" width="2" height="2" fill="#4f9a2e"/>
    <rect x="36" y="25" width="2" height="2" fill="#4f9a2e"/>
    <rect x="24" y="14" width="2" height="2" fill="#f4e04d"/>
    <rect x="38" y="18" width="2" height="2" fill="#ffffff"/>
    <rect x="32" y="9" width="2" height="2" fill="#e86a92"/>
    <rect x="44" y="14" width="2" height="2" fill="#f4e04d"/>
    <rect x="18" y="18" width="2" height="2" fill="#ffffff"/>
    <rect x="28" y="23" width="2" height="2" fill="#e86a92"/>
  </g>

  <!-- 2: stone path. -->
  <g transform="translate(128 0)">
    <polygon points="32,0 64,16 32,32 0,16" fill="#8c979f" stroke="#8c979f" stroke-width="1"/>
    <polygon points="32,3 58,16 32,29 6,16" fill="#a9b4bd"/>
    <path d="M19 9.5 L45 22.5 M19 22.5 L45 9.5" stroke="#7d8890" stroke-width="1" fill="none"/>
  </g>

  <!-- 3: the cell cursor, which the demo draws over the cell under the mouse. -->
  <g transform="translate(192 0)">
    <polygon points="32,1 62,16 32,31 2,16" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- 4 to 7: water, the four frames of its animation. The ripples move right by 4 pixels a frame. -->
  <g transform="translate(0 32)">
    <polygon points="32,0 64,16 32,32 0,16" fill="#2f7fc1" stroke="#2f7fc1" stroke-width="1"/>
    <g clip-path="url(#water-surface)" fill="#9fd4f5">
      <rect x="14" y="9" width="8" height="1"/>
      <rect x="38" y="13" width="8" height="1"/>
      <rect x="22" y="17" width="8" height="1"/>
      <rect x="48" y="20" width="8" height="1"/>
      <rect x="30" y="24" width="8" height="1"/>
    </g>
  </g>
  <g transform="translate(64 32)">
    <polygon points="32,0 64,16 32,32 0,16" fill="#2f7fc1" stroke="#2f7fc1" stroke-width="1"/>
    <g clip-path="url(#water-surface)" fill="#9fd4f5">
      <rect x="18" y="9" width="8" height="1"/>
      <rect x="42" y="13" width="8" height="1"/>
      <rect x="26" y="17" width="8" height="1"/>
      <rect x="52" y="20" width="8" height="1"/>
      <rect x="34" y="24" width="8" height="1"/>
    </g>
  </g>
  <g transform="translate(128 32)">
    <polygon points="32,0 64,16 32,32 0,16" fill="#2f7fc1" stroke="#2f7fc1" stroke-width="1"/>
    <g clip-path="url(#water-surface)" fill="#9fd4f5">
      <rect x="22" y="9" width="8" height="1"/>
      <rect x="46" y="13" width="8" height="1"/>
      <rect x="30" y="17" width="8" height="1"/>
      <rect x="8" y="20" width="8" height="1"/>
      <rect x="38" y="24" width="8" height="1"/>
    </g>
  </g>
  <g transform="translate(192 32)">
    <polygon points="32,0 64,16 32,32 0,16" fill="#2f7fc1" stroke="#2f7fc1" stroke-width="1"/>
    <g clip-path="url(#water-surface)" fill="#9fd4f5">
      <rect x="26" y="9" width="8" height="1"/>
      <rect x="50" y="13" width="8" height="1"/>
      <rect x="34" y="17" width="8" height="1"/>
      <rect x="12" y="20" width="8" height="1"/>
      <rect x="42" y="24" width="8" height="1"/>
    </g>
  </g>
</svg>
