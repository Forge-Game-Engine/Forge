<svg xmlns="http://www.w3.org/2000/svg" width="192" height="96" viewBox="0 0 192 96" shape-rendering="crispEdges">
  <!-- Three 64 by 96 isometric wall and prop tiles for the isometric tilemap demo. Original art, made for this demo. -->
  <!-- Each stands on the 64 by 32 diamond at the bottom of its image, a cell's footprint, and reaches 64 pixels up over the cells behind it. -->

  <!-- 0: stone wall, a block filling its cell. -->
  <g transform="translate(0 0)">
    <polygon points="32,0 64,16 32,32 0,16" fill="#d3cdc1"/>
    <polygon points="0,16 32,32 32,96 0,80" fill="#a39b8e"/>
    <polygon points="32,32 64,16 64,80 32,96" fill="#7f776c"/>
    <path d="M0 32 L32 48 L64 32 M0 48 L32 64 L64 48 M0 64 L32 80 L64 64" stroke="#5f584f" stroke-width="1" fill="none"/>
    <path d="M16 40 L16 56 M8 52 L8 68 M24 60 L24 76 M16 72 L16 88" stroke="#5f584f" stroke-width="1" fill="none"/>
    <path d="M48 40 L48 56 M56 52 L56 68 M40 60 L40 76 M48 72 L48 88" stroke="#5f584f" stroke-width="1" fill="none"/>
    <path d="M0 16 L32 0 L64 16" stroke="#ece7dd" stroke-width="1" fill="none"/>
  </g>

  <!-- 1: crate, smaller than its cell, with its shadow on the cell. -->
  <g transform="translate(64 0)">
    <polygon points="6,80 32,67 58,80 32,93" fill="#000000" fill-opacity="0.25"/>
    <polygon points="12,52 32,42 52,52 32,62" fill="#d39a58"/>
    <polygon points="12,52 32,62 32,90 12,80" fill="#a8723b"/>
    <polygon points="32,62 52,52 52,80 32,90" fill="#80552c"/>
    <path d="M22 47 L42 57" stroke="#a8723b" stroke-width="1" fill="none"/>
    <path d="M12 66 L32 76 L52 66" stroke="#5e3d1e" stroke-width="1" fill="none"/>
    <path d="M12 52 L32 62 L52 52 M32 62 L32 90" stroke="#5e3d1e" stroke-width="1" fill="none"/>
  </g>

  <!-- 2: tree, a trunk at the cell's center under a wide canopy. -->
  <g transform="translate(128 0)">
    <ellipse cx="32" cy="80" rx="20" ry="9" fill="#000000" fill-opacity="0.25"/>
    <rect x="29" y="50" width="6" height="30" fill="#6b4226"/>
    <rect x="29" y="50" width="2" height="30" fill="#8a5a36"/>
    <circle cx="32" cy="36" r="22" fill="#2f7a35"/>
    <circle cx="25" cy="31" r="15" fill="#3f9440"/>
    <circle cx="38" cy="25" r="11" fill="#55b04f"/>
    <circle cx="22" cy="24" r="5" fill="#6cc860"/>
  </g>
</svg>
