<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16" viewBox="0 0 32 16" shape-rendering="crispEdges">
  <!-- Tile 0: blue, with a yellow marker in its top-right corner, so each
       flip and turn puts the marker in a different corner. -->
  <rect x="0" y="0" width="16" height="16" fill="#3050e0" />
  <rect x="10" y="0" width="6" height="6" fill="#ffd000" />
  <!-- Tile 1: green. -->
  <rect x="16" y="0" width="16" height="16" fill="#00ff00" />
</svg>
