name: Claude

# Adding the `claude` label to an issue starts a Claude Code run on a new
# `claude/issue-<n>-...` branch off `dev`. For a new feature, large change or
# refactor whose issue doesn't link a design, it first has the design-author
# agent write a design in /design and the solution-reviewer agent review it.
# If the design has blocking open questions, or the review rejects or
# escalates it, the run commits the design on the branch, posts the questions
# or verdict in its tracking comment and stops without a pull request.
# Otherwise it implements the issue, with unit and e2e tests, and opens a pull
# request for human review that also carries the design. The label is removed
# when the run ends, so adding it again starts a fresh attempt.
#
# Issues can be labeled in any order. The `gate` job reads the issue's
# `Depends on #N` lines first: while any of those issues is still open, it
# swaps `claude` for `claude-waiting`, comments which issues it's waiting on
# and skips the run. When the last one closes, claude-unblock.yml adds
# `claude` back, which runs this workflow again.
#
# A comment or review that mentions `@claude` starts a run too. On a pull
# request, Claude pushes to that pull request's branch; on an issue, it works
# the way a labeled issue does.
#
# Requires the Claude GitHub App (https://github.com/apps/claude) installed on
# the repository and a `CLAUDE_CODE_OAUTH_TOKEN` secret (`claude setup-token`).
# The `CLAUDE_LABELER_APP_SLUG` variable names the GitHub App that
# claude-unblock.yml labels issues with; its labels are the only ones from a
# bot that start a run. Its `@claude` comments are the only bot comments that
# do: claude-pr-review.yml posts one when its review of a pull request a label
# run opened requests changes, which starts a run that addresses the review.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  # One run per issue or pull request at a time; different issues and pull
  # requests run side by side.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    # Only a label run waits for dependencies. An `@claude` mention is a
    # person asking for a run now, so it skips this job.
    if: >-
      github.event_name == 'issues' && github.event.label.name == 'claude' && (
        github.event.sender.type != 'Bot' ||
        github.event.sender.login == format('{0}[bot]', vars.CLAUDE_LABELER_APP_SLUG)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      blocked: ${{ steps.dependencies.outputs.blocked }}
    steps:
      - name: Checkout the dependency script
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1
          sparse-checkout: .github/scripts

      - name: Wait for open dependencies
        id: dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: .github/scripts/claude-dependencies.sh gate "$ISSUE"

  claude:
    # Skips bots (including Claude's own comments), so a run can't start
    # another one. The exceptions are the labeler App's `claude` label, which
    # is how claude-unblock.yml starts a run, and its `@claude` comment on a
    # pull request, which is how claude-pr-review.yml starts a fix round. A
    # label run starts only once the gate has found every dependency closed.
    needs: gate
    if: >-
      !cancelled() && (
        (github.event_name == 'issues' && needs.gate.result == 'success' && needs.gate.outputs.blocked == 'false') ||
        (github.event_name == 'issue_comment' && github.event.sender.type == 'Bot' &&
          github.event.sender.login == format('{0}[bot]', vars.CLAUDE_LABELER_APP_SLUG) &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event.sender.type != 'Bot' && (
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
        ))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      # Exchanged for the Claude GitHub App's token. Pushes and pull requests
      # made with it trigger CI, unlike ones made with GITHUB_TOKEN.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            documentation-site/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix documentation-site ci

      # Installs the Chromium build that matches the pinned @playwright/test
      # version, plus the system libraries it needs, so the run can run
      # `npm run test:e2e` (the same step as ci.yml's test-e2e job).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          # The Agent tool starts subagents in the background by default. In
          # this headless run, the main agent then ends its turn to wait for
          # one, the action takes that as the end of the session, and the job
          # exits with the subagent killed and nothing done. Run every
          # subagent in the foreground instead.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          allowed_bots: ${{ format('{0}[bot]', vars.CLAUDE_LABELER_APP_SLUG) }}
          base_branch: dev
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --allowedTools "Agent,Task,Skill,TodoWrite,WebSearch,WebFetch,Bash(npm ci),Bash(npm run:*),Bash(npm --prefix documentation-site ci),Bash(npm --prefix documentation-site run:*),Bash(npx prettier --write:*),Bash(npx cspell:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git fetch origin:*),Bash(git merge:*),Bash(git merge-base:*),Bash(git checkout:*),Bash(git rev-parse:*),Bash(npm install --package-lock-only),Bash(npm --prefix documentation-site install --package-lock-only),Bash(gh issue view:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh run view:*)"
            --append-system-prompt "This run is on ${{ (github.event.pull_request || github.event.issue.pull_request) && 'pull request' || 'issue' }} #${{ github.event.issue.number || github.event.pull_request.number }}. You are working unattended; nobody will answer questions during this run. Run every agent in the foreground (never with run_in_background) and wait for its result: ending your turn ends the run. Follow CLAUDE.md and AGENTS.md exactly, including the matching skill in .claude/skills and the full verification checklist. On an issue, first decide whether it needs a design. A new feature, large change or refactor needs one unless the issue links a design document in /design that already settles the approach; a one-line or clearly scoped fix does not. When it needs one: run the design-author agent with 'issue #${{ github.event.issue.number || github.event.pull_request.number }}' (and, when the issue's comments answer questions an earlier run stopped on, tell it to update that run's design: fetch the branch named in the earlier tracking comment with 'git fetch origin <branch>' and restore the document with 'git show origin/<branch>:<path>'). Then run the solution-reviewer agent on the design document. On REVISE, have design-author revise the document once and review it again; a second verdict that is not APPROVE counts as REJECT. If design-author's report says 'Blocking: yes', or solution-reviewer returns REJECT or ESCALATE, do not implement: commit the design document, push the branch, post the blocking questions or the verdict in your tracking comment with the branch name and the document's path, open no pull request, and stop. Otherwise implement the issue, following the design, and commit the design document in the same pull request; the design review is this change's solution-reviewer run. If the issue only asks for a design document, the reviewed document is the whole change. Without a design, run the solution-reviewer agent on your plan for anything beyond a one-line change, and if it returns REJECT or ESCALATE, or the request is ambiguous or only works by bending a core design, do not guess: explain the open question or the verdict in your tracking comment and stop without pushing. Design-author doesn't commit; you commit what it writes. Testing is part of implementing: add unit tests next to the code, and for anything touching rendering, input or the game loop add e2e coverage with the write-e2e-test skill and run 'npm run test:e2e' (Playwright's Chromium is installed). Dependencies were installed from dev; if the branch you are on changes package-lock.json, run 'npm ci' (or 'npm --prefix documentation-site ci') before checking anything. Docs-site demos can be built and type-checked with 'npm --prefix documentation-site run <script>', but a human checks demo pages in the browser, so say in the pull request which demo pages need a manual check. When this run is on a pull request, push your commits to its branch and do not open another pull request. When it is on an issue, after pushing your branch, open the pull request yourself instead of posting a 'Create a PR' link: run 'gh pr create --base dev --head <your branch>' with a Conventional Commits title (it becomes the squash-merge commit message and decides whether CI requires a CHANGELOG.md entry) and a body that fills in .github/pull_request_template.md, ticks only the checks you actually ran and that passed, includes 'Closes #${{ github.event.issue.number || github.event.pull_request.number }}', and records the solution-reviewer verdict. Put the pull request link in your tracking comment. When a pull request conflicts with dev, or you are asked to resolve its conflicts, merge dev into its branch: the checkout is shallow, so run 'git fetch origin --unshallow' first (git can't find the merge base otherwise), then 'git merge origin/dev'. Resolve each conflict so both sides' changes survive. Never hand-edit a lockfile: take dev's version ('git checkout origin/dev -- package-lock.json') and regenerate it with 'npm install --package-lock-only' (or 'npm --prefix documentation-site install --package-lock-only'), then run 'npm ci'. Run the verification checklist, commit the merge with 'git commit --no-edit' and push. Never rebase or force-push: only a merge commit with dev as a parent clears the conflict on GitHub. When asked why an earlier run stopped, read its log with 'gh run view <run id> --log' instead of guessing."

      - name: Remove the trigger label
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --remove-label claude
