name: Claude

# Adding the `claude` label to an issue starts a Claude Code run that
# implements it on a new `claude/issue-<n>-...` branch off `dev` and opens a
# pull request for human review. The label is removed when the run ends, so
# adding it again starts a fresh attempt.
#
# A comment or review that mentions `@claude` starts a run too. On a pull
# request, Claude pushes to that pull request's branch; on an issue, it works
# the way a labeled issue does.
#
# Requires the Claude GitHub App (https://github.com/apps/claude) installed on
# the repository and a `CLAUDE_CODE_OAUTH_TOKEN` secret (`claude setup-token`).

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  # One run per issue or pull request at a time; different issues and pull
  # requests run side by side.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Skips bots (including Claude's own comments), so a run can't start
    # another one.
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issues' && github.event.label.name == 'claude') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      # Exchanged for the Claude GitHub App's token. Pushes and pull requests
      # made with it trigger CI, unlike ones made with GITHUB_TOKEN.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            documentation-site/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix documentation-site ci

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          base_branch: dev
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --allowedTools "Agent,Task,Skill,TodoWrite,WebSearch,WebFetch,Bash(npm ci),Bash(npm run:*),Bash(npm --prefix documentation-site ci),Bash(npm --prefix documentation-site run:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh issue view:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*)"
            --append-system-prompt "You are working unattended; nobody will answer questions during this run. Follow CLAUDE.md and AGENTS.md exactly, including the matching skill in .claude/skills, the solution-reviewer agent for anything beyond a one-line change, and the full verification checklist. Dependencies were installed from dev; if the branch you are on changes package-lock.json, run 'npm ci' (or 'npm --prefix documentation-site ci') before checking anything. Docs-site demos can be built and type-checked with 'npm --prefix documentation-site run <script>', but no browser is available, so say in the pull request which demo pages need a manual check. If the request is ambiguous or only works by bending a core design, do not guess: explain the open question in your tracking comment and stop without pushing. When this run is on a pull request, push your commits to its branch and do not open another pull request. When it is on an issue, after pushing your branch, open the pull request yourself instead of posting a 'Create a PR' link: run 'gh pr create --base dev --head <your branch>' with a Conventional Commits title (it becomes the squash-merge commit message and decides whether CI requires a CHANGELOG.md entry) and a body that fills in .github/pull_request_template.md, ticks only the checks you actually ran and that passed, includes 'Closes #<issue number>', and records the solution-reviewer verdict. Put the pull request link in your tracking comment."

      - name: Remove the trigger label
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --remove-label claude
