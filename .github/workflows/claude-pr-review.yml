name: Claude PR review

# Opening a pull request (or marking a draft ready for review) starts a
# Claude Code run that reviews it with the `pr-reviewer` agent
# (.claude/agents/pr-reviewer.md) and posts the checklist as a comment, with
# inline comments on the lines it flags. It never pushes, approves or blocks
# merging. New commits don't start another review: to review again, comment
# `@claude review` on the pull request. claude.yml skips those comments, so
# only this workflow runs for them.
#
# Requires the Claude GitHub App (https://github.com/apps/claude) installed on
# the repository and a `CLAUDE_CODE_OAUTH_TOKEN` secret (`claude setup-token`).

on:
  pull_request:
    branches:
      - dev
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Pull requests from forks don't get the repository's secrets when they
    # open, so the run couldn't authenticate. A `@claude review` comment runs
    # with them, and claude-code-action only accepts it from a commenter with
    # write access. Bot comments (including this review's own) never start a
    # run.
    if: >-
      (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.sender.type != 'Bot' &&
        contains(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      # Exchanged for the Claude GitHub App's token.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          # The reviewer diffs against origin/<base>.
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pull requests the `claude` label opens (claude.yml) are reviewed
          # too.
          allowed_bots: 'claude[bot]'
          prompt: |
            Review pull request #${{ github.event.pull_request.number || github.event.issue.number }} in ${{ github.repository }}.
            Read its title and base branch with `gh pr view ${{ github.event.pull_request.number || github.event.issue.number }} --json title,baseRefName`.

            Run the pr-reviewer agent (.claude/agents/pr-reviewer.md) on it, passing the number, title and base branch.
            Then write its report, unchanged, to /tmp/forge-review.md and post it as one comment with `gh pr comment ${{ github.event.pull_request.number || github.event.issue.number }} --body-file /tmp/forge-review.md`.
            For each finding that points at a line in the diff, also add an inline comment on that line with mcp__github_inline_comment__create_inline_comment.
            Don't edit repository files, push, approve or request changes.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --allowedTools "Agent,Task,Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
