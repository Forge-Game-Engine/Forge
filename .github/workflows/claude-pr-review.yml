name: Claude PR review

# Opening a pull request (or marking a draft ready for review) starts a
# Claude Code run that reviews it with the `pr-reviewer` agent
# (.claude/agents/pr-reviewer.md) and posts the checklist as a comment, with
# inline comments on the lines it flags. It never pushes, approves or blocks
# merging, and nothing reviews a pull request again automatically: to review
# new commits, run the `pr-reviewer` agent locally. (An `@claude` mention
# starts claude.yml's implementing run, not a review.)
#
# When the review of a pull request that a `claude` label run just opened
# requests changes, the labeler App comments `@claude` on it, which starts
# claude.yml's run to address the review. A comment made with GITHUB_TOKEN
# wouldn't start a workflow. The App needs read and write access to Issues
# (see claude-unblock.yml), which covers comments on pull requests. Only the
# `opened` review does this, and the fix run's pushes don't start another
# review, so a pull request gets one automatic fix round.
#
# Requires the Claude GitHub App (https://github.com/apps/claude) installed on
# the repository and a `CLAUDE_CODE_OAUTH_TOKEN` secret (`claude setup-token`).

on:
  pull_request:
    branches:
      - dev
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Pull requests from forks don't get the repository's secrets, so the run
    # couldn't authenticate.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      # Exchanged for the Claude GitHub App's token.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The reviewer diffs against origin/<base>.
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          # The Agent tool starts subagents in the background by default. In
          # this headless run, the main agent then ends its turn to wait for
          # one, the action takes that as the end of the session, and the job
          # exits with the subagent killed and nothing done. Run every
          # subagent in the foreground instead.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pull requests the `claude` label opens (claude.yml) are reviewed
          # too.
          allowed_bots: 'claude[bot]'
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Its title is "${{ github.event.pull_request.title }}" and its base branch is "${{ github.event.pull_request.base.ref }}".

            Run the pr-reviewer agent (.claude/agents/pr-reviewer.md) on it, passing the number, title and base branch.
            Then write its report, unchanged, to /tmp/forge-review.md and post it as one comment with `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/forge-review.md`.
            For each finding that points at a line in the diff, also add an inline comment on that line with mcp__github_inline_comment__create_inline_comment.
            Don't edit repository files, push, approve or request changes.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --allowedTools "Agent,Task,Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"

      # Reads the report the review step wrote, and only an exact verdict
      # line counts, so a finding that quotes the verdict can't trigger it.
      - name: Check whether the review requested changes
        id: verdict
        if: >-
          github.event.action == 'opened' &&
          github.event.pull_request.user.login == 'claude[bot]'
        run: |
          if [ -f /tmp/forge-review.md ] && grep -qxF '**Verdict:** CHANGES REQUESTED' /tmp/forge-review.md; then
            echo "changes-requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes-requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the labeler App's token
        id: labeler
        if: steps.verdict.outputs.changes-requested == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDE_LABELER_APP_ID }}
          private-key: ${{ secrets.CLAUDE_LABELER_PRIVATE_KEY }}

      - name: Ask Claude to address the review
        if: steps.verdict.outputs.changes-requested == 'true'
        env:
          GH_TOKEN: ${{ steps.labeler.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "@claude Address the Forge review above and its inline comments.

          - Fix every finding the review marks as failing, and push the fixes to this pull request's branch.
          - Answer each question the review asks. Change the code when the answer shows it's wrong.
          - Leave the review's "Needs a manual check" items for a person.

          No new review will run after your pushes. So in your tracking comment, list each finding and question with what you did about it."
